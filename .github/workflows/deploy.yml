name: Deploy to SJTU Server

on:
  push:
    branches:
      - main  

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build HTML
      run: |
        source .venv/bin/activate
        sphinx-build -b html docs/source docs/build/html

    - name: Deploy files locally
      run: |
        mkdir -p /var/www/html/food-docs
        rsync -av --delete docs/build/html/ /var/www/html/food-docs/