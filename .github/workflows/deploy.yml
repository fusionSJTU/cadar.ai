name: Deploy to SJTU Server

on:
  push:
    branches:
      - main  

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
       
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Build HTML
      run: |
        sphinx-build -b html docs/source docs/build/html

    - name: Deploy to Server via SSH
      uses: easingthemes/ssh-deploy@main
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SJTU_SERVER_SSH_KEY }}
        ARGS: "-rlgoDzvc -i --delete"
        SOURCE: "docs/build/html/"      
        REMOTE_HOST: ${{ secrets.SJTU_SERVER_IP }}
        REMOTE_USER: ${{ secrets.SJTU_SERVER_USER }}
        TARGET: "/var/www/html/food-docs/"
        SSH_CMD_ARGS: "-o StrictHostKeyChecking=no"